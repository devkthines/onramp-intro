<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'/>
    <title>Speaker Submission</title>
    <link rel='stylesheet' href='styles.css'/>
  </head>
  <body>
    <header class='speaker-form-header'>
      <h1>Speaker Submission</h1>
      <p><em>Want to speak at our fake conference? Fill out
        this form.</em></p>
    </header>
        <form action='' method='get' class='speaker-form'>
          <div id="form-errors" role="alert" aria-live="assertive" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;"></div>
        <div class='form-row'>
  <label for='full-name'>Name</label>
      <input id='full-name' name='full-name' type='text' required aria-required="true" aria-describedby="full-name-help"/>
      <div id='full-name-help' class='instructions'>Your full name as you'd like it on the schedule.</div>
</div>
<div class='form-row'>
  <label for='email'>Email</label>
      <input id='email'
        name='email'
        type='email'
        placeholder='joe@example.com'
        required aria-required="true" aria-describedby="email-help"/>
      <div id='email-help' class='instructions'>We'll only use this to contact you about the talk.</div>
</div>
    <fieldset class='legacy-form-row'>
      <legend>Type of Talk</legend>
      <input id='talk-type-1'
        name='talk-type'
        type='radio'
        value='main-stage' aria-describedby="talk-type-help"/>
      <label for='talk-type-1' class='radio-label'>Main Stage</label>
      <input id='talk-type-2'
        name='talk-type'
        type='radio'
        value='workshop'
        checked aria-describedby="talk-type-help"/>
      <label for='talk-type-2' class='radio-label'>Workshop</label>
      <div id='talk-type-help' class='instructions'>Select the talk type that best fits your session.</div>
    </fieldset>
<div class='form-row'>
  <label for='t-shirt'>T-Shirt Size</label>
  <select id='t-shirt' name='t-shirt'>
    <option value='xs'>Extra Small</option>
    <option value='s'>Small</option>
    <option value='m'>Medium</option>
    <option value='l'>Large</option>
  </select>
</div>
<div class='form-row'>
  <label for='abstract'>Abstract</label>
  <textarea id='abstract' name='abstract' required aria-required="true" aria-describedby="abstract-help"></textarea>
  <div id='abstract-help' class='instructions'>Describe your talk in 500 words or less</div>
</div>
<div class='form-row'>
  <label class='checkbox-label'>
  <input id='available'
         name='available'
         type='checkbox'
         value='is-available'/>
  <span>I’m actually available the date of the talk</span>
  </label>
</div>
<div class='form-row'>
  <button>Submit</button>
</div>
</form>
  </body>
</html>
